<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More4nature — Coordinación</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:14px;color:#222;background:#fafafa;padding:24px}
h1{font-size:22px;font-weight:600;text-align:center;margin-bottom:4px}
.subtitle{font-size:13px;color:#666;text-align:center;margin-bottom:20px}
.diagram-section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:20px}
.diagram-section iframe{width:100%;height:600px;border:none;border-radius:4px;display:block}
.notes-section{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:20px}
.notes-section h2{font-size:15px;font-weight:600;margin-bottom:10px;color:#333}
.notes-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.note-box{background:#fafafa;border:1px solid #ddd;border-radius:6px;overflow:hidden}
.note-box-head{background:#f0f0f0;padding:7px 10px;font-size:12px;font-weight:600;color:#444}
.note-box-fixed{font-size:12px;color:#444;padding:8px 10px;border-bottom:1px solid #eee;line-height:1.6}
.note-box-fixed a{color:#378ADD;text-decoration:none}
.note-box textarea{width:100%;border:none;background:transparent;padding:8px 10px;font-size:12px;color:#333;resize:vertical;min-height:70px;outline:none;font-family:Arial,sans-serif}
.cases-section h2{font-size:15px;font-weight:600;margin-bottom:12px;color:#333}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}
.col-card{background:#fff;border:1px solid #ddd;border-radius:8px;overflow:hidden}
.col-head{padding:12px 14px;border-bottom:1px solid #eee;background:#f5f5f5}
.col-head h3{font-size:14px;font-weight:600;color:#222}
.col-meta{margin-top:8px}
.meta-row{display:flex;align-items:baseline;gap:6px;margin-bottom:4px}
.meta-label{font-size:11px;color:#888;min-width:80px}
.meta-val{font-size:12px;color:#222;flex:1;border:none;border-bottom:1px solid #ddd;background:transparent;outline:none;font-family:Arial,sans-serif;padding:1px 2px}
.meta-val:focus{border-bottom-color:#378ADD}
.link-row{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.link-label{font-size:11px;color:#888;min-width:80px}
.link-input{font-size:12px;color:#378ADD;flex:1;border:none;border-bottom:1px solid #ddd;background:transparent;outline:none;font-family:Arial,sans-serif;padding:1px 2px}
.link-input:focus{border-bottom-color:#378ADD}
.link-open{font-size:11px;color:#378ADD;text-decoration:none;margin-left:4px}
.prog-bar{height:3px;background:#eee}
.prog-fill{height:100%;background:#1D9E75;transition:width .3s}
.checklist{padding:10px 14px 14px}
.sec-label{font-size:10px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.sec-label:first-child{margin-top:2px}
.check-row{display:flex;align-items:flex-start;gap:7px;padding:2px 0}
.check-row input[type=checkbox]{margin-top:2px;flex-shrink:0;cursor:pointer;accent-color:#1D9E75}
.check-row label{font-size:12px;color:#333;cursor:pointer;line-height:1.4}
.check-row.done label{color:#bbb;text-decoration:line-through}
.sh-block{margin-top:8px;border:1px solid #eee;border-radius:6px;overflow:hidden}
.sh-head{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#f8f8f8;cursor:pointer;user-select:none}
.sh-name{font-size:12px;font-weight:600;color:#333;flex:1}
.sh-badge{font-size:10px;color:#378ADD;background:#e8f2fc;padding:2px 6px;border-radius:4px}
.sh-tog{font-size:12px;color:#999;transition:transform .2s}
.sh-delete{font-size:11px;color:#cc4444;background:none;border:none;cursor:pointer;padding:2px 6px;border-radius:3px;margin-left:4px}
.sh-delete:hover{background:#ffeaea}
.sh-body{padding:6px 10px 10px}
.sh-body.collapsed{display:none}
.int-type{font-size:11px;font-weight:600;color:#555;margin:8px 0 4px;padding:3px 6px;background:#f0f0f0;border-radius:3px}
.int-objetivo{font-size:12px;color:#222;flex:1;border:none;border-bottom:1px solid #ddd;background:transparent;outline:none;font-family:Arial,sans-serif;padding:2px 4px}
.int-objetivo:focus{border-bottom-color:#378ADD}
.add-sh-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:#378ADD;cursor:pointer;margin-top:10px;padding:6px 0;background:none;border:none;width:100%}
.add-int-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:#888;cursor:pointer;margin-top:6px;padding:4px 0;background:none;border:none;width:100%}
.add-int-btn:hover{color:#378ADD}
.add-sh-form{margin-top:8px;border:1px solid #ddd;border-radius:6px;padding:10px;background:#fafafa}
.form-row{margin-bottom:8px}
.form-row label{font-size:11px;color:#666;display:block;margin-bottom:3px}
.form-row input[type=text]{width:100%;font-size:12px;padding:5px 8px;border:1px solid #ddd;border-radius:4px}
.combined-checks{margin:4px 0 8px;padding-left:4px}
.combined-checks label{display:flex;align-items:center;gap:6px;font-size:12px;color:#333;margin-bottom:4px;cursor:pointer}
.form-btns{display:flex;gap:8px}
.form-btns button{font-size:12px;padding:5px 12px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer}
.form-btns button:first-child{background:#378ADD;color:#fff;border-color:#378ADD}
.saving{font-size:11px;color:#aaa;text-align:center;padding:.4rem 0;min-height:20px}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.8);display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;z-index:999}
@media(max-width:700px){.cols{grid-template-columns:1fr}.notes-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">Cargando datos...</div>

<h1>More4nature</h1>
<p class="subtitle">Coordinación interna del proyecto</p>

<div class="diagram-section">
  <iframe src="https://drive.google.com/file/d/1vhwlbh_sn8pdwDffdSQ4vpxR_uDUaAeF/preview" allowfullscreen></iframe>
</div>

<div class="notes-section">
  <h2>Notas</h2>
  <div class="notes-grid">
    <div class="note-box">
      <div class="note-box-head">Coordinación general</div>
      <div class="note-box-fixed">
        <a href="https://drive.google.com/drive/folders/1j2vygpQ22gpV9keNlpVRFnot6X8dsWpW?usp=share_link" target="_blank">📁 Link to folder</a><br><br>
        Jens Noe — <a href="mailto:jnh@verdensskove.org">jnh@verdensskove.org</a><br>
        Carolina Infante — <a href="mailto:cio@verdensskove.org">cio@verdensskove.org</a>
      </div>
      <textarea id="note-general" placeholder="Notas generales del proyecto..." oninput="queueSave()"></textarea>
    </div>
    <div class="note-box">
      <div class="note-box-head">Honduras</div>
      <textarea id="note-honduras" placeholder="Notas para Honduras..." oninput="queueSave()"></textarea>
    </div>
    <div class="note-box">
      <div class="note-box-head">Bolivia</div>
      <textarea id="note-bolivia" placeholder="Notas para Bolivia..." oninput="queueSave()"></textarea>
    </div>
    <div class="note-box">
      <div class="note-box-head">Colombia</div>
      <textarea id="note-colombia" placeholder="Notas para Colombia..." oninput="queueSave()"></textarea>
    </div>
  </div>
</div>

<div class="cases-section">
  <h2>Seguimiento por caso</h2>
  <div class="cols" id="cases-grid"></div>
</div>

<div class="saving" id="saving-status"></div>

<script>
const CASES_DEF = [
  {id:"honduras", title:"Honduras", partner:"Guaruma", stakeholders:[
    {id:"sh_fupnapib", name:"FUPNAPIB", combined:false, extraInts:[]},
    {id:"sh_juntas", name:"Juntas de Agua", combined:false, extraInts:[]},
    {id:"sh_icf", name:"ICF", combined:false, extraInts:[]}
  ]},
  {id:"bolivia", title:"Bolivia", partner:"Bosques del Mundo", stakeholders:[]},
  {id:"colombia", title:"Colombia", partner:"Human Forest", stakeholders:[]}
];

const INTERACTION_TYPES = [
  {id:"reclu", name:"1: Reclutamiento", items:[
    {k:"msg_enviado", t:"Mensaje de invitación enviado"},
    {k:"msg_seguimiento", t:"Seguimiento de mensaje"},
    {k:"msg_drive", t:"En DRIVE - originales"},
    {k:"msg_sp", t:"En SHAREPOINT - original y en inglés"}
  ]},
  {id:"bienvenida", name:"2: Bienvenida", items:[
    {k:"bien_consent_drive", t:"Consentimientos — En DRIVE - originales"},
    {k:"bien_consent_sp", t:"Consentimientos — En SHAREPOINT - originales y en inglés"},
    {k:"bien_diseno_drive", t:"Diseño de taller — En DRIVE - original"},
    {k:"bien_diseno_sp", t:"Diseño de taller — En SHAREPOINT - original y en inglés"},
    {k:"bien_kobo", t:"Verificar KOBO participantes"},
    {k:"bien_fotos_drive", t:"Subir fotos y notas — En DRIVE - originales"},
    {k:"bien_fotos_sp", t:"Subir fotos y notas — En SHAREPOINT - originales y en inglés"},
    {k:"bien_kobo_ref", t:"Realizar KOBO de reflexión"},
    {k:"bien_base", t:"Actualizar interacción en base de datos"}
  ]},
  {id:"compromiso", name:"3: Compromiso", items:[
    {k:"comp_consent_drive", t:"Consentimientos — En DRIVE - originales"},
    {k:"comp_consent_sp", t:"Consentimientos — En SHAREPOINT - originales y en inglés"},
    {k:"comp_diseno_drive", t:"Diseño de taller — En DRIVE - original"},
    {k:"comp_diseno_sp", t:"Diseño de taller — En SHAREPOINT - original y en inglés"},
    {k:"comp_kobo", t:"Verificar KOBO participantes"},
    {k:"comp_fotos_drive", t:"Subir fotos y notas — En DRIVE - originales"},
    {k:"comp_fotos_sp", t:"Subir fotos y notas — En SHAREPOINT - originales y en inglés"},
    {k:"comp_kobo_ref", t:"Realizar KOBO de reflexión"},
    {k:"comp_base", t:"Actualizar interacción en base de datos"}
  ]}
];

const EXTRA_INT_ITEMS = [
  {k:"consent_drive", t:"Consentimientos — En DRIVE - originales"},
  {k:"consent_sp", t:"Consentimientos — En SHAREPOINT - originales y en inglés"},
  {k:"diseno_drive", t:"Diseño de taller — En DRIVE - original"},
  {k:"diseno_sp", t:"Diseño de taller — En SHAREPOINT - original y en inglés"},
  {k:"kobo", t:"Verificar KOBO participantes"},
  {k:"fotos_drive", t:"Subir fotos y notas — En DRIVE - originales"},
  {k:"fotos_sp", t:"Subir fotos y notas — En SHAREPOINT - originales y en inglés"},
  {k:"kobo_ref", t:"Realizar KOBO de reflexión"},
  {k:"base", t:"Actualizar interacción en base de datos"}
];

const PRE_ETAPAS = [
  {k:"eval", t:"Evaluación inicial de Etapa 1 listo para verificación con el consorcio"},
  {k:"reclu_plan", t:"Planificación de reclutamiento: Actores identificados y borradores de mensajes de invitación"},
  {k:"bienvenida_plan", t:"Planificación de bienvenida: Borradores de diseño de interacciones"},
  {k:"aprobacion", t:"Aprobación del consorcio para continuar con Etapa 2"}
];

let state = {cases: JSON.parse(JSON.stringify(CASES_DEF)), checks:{}, links:{}, responsables:{}, notes:{}};
let addingShFor = null;
let saveTimer = null;

// ---- SHARED STATE via Firebase ----
const FB = "https://more4nature-bf513-default-rtdb.firebaseio.com";

async function loadState(){
  try {
    const res = await fetch(FB + "/state.json");
    const data = await res.json();
    if(data && typeof data === "object"){
      if(data.checks && typeof data.checks === "object") state.checks = data.checks;
      if(data.links && typeof data.links === "object") state.links = data.links;
      if(data.responsables && typeof data.responsables === "object") state.responsables = data.responsables;
      if(data.notes && typeof data.notes === "object") state.notes = data.notes;
      // Firebase converts arrays to objects — convert back
      if(data.cases && typeof data.cases === "object"){
        const casesArr = Object.values(data.cases);
        if(casesArr.length >= 3){
          casesArr.forEach(c => {
            if(c.stakeholders && !Array.isArray(c.stakeholders)){
              c.stakeholders = Object.values(c.stakeholders).map(sh => {
                if(sh.extraInts && !Array.isArray(sh.extraInts)){
                  sh.extraInts = Object.values(sh.extraInts);
                } else if(!sh.extraInts) {
                  sh.extraInts = [];
                }
                return sh;
              });
            } else if(!c.stakeholders){
              c.stakeholders = [];
            }
          });
          state.cases = casesArr;
        }
      }
    }
  } catch(e) {
    console.warn("Could not load shared state, using defaults", e);
  }
  document.getElementById("loading").style.display = "none";
}

async function persistNow(){
  try {
    // Collect current note values into state before saving
    ["general","honduras","bolivia","colombia"].forEach(k=>{
      const el = document.getElementById("note-"+k);
      if(el) state.notes[k] = el.value;
    });
    await fetch(FB + "/state.json", {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(state)
    });
    showSaving("Guardado ✓");
  } catch(e) {
    showSaving("Error al guardar");
  }
}

function queueSave(){
  showSaving("Guardando...");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 800);
}

function showSaving(msg){
  const el = document.getElementById("saving-status");
  if(el){ el.textContent = msg; if(msg==="Guardado ✓") setTimeout(()=>el.textContent="",2000); }
}

function loadNotes(){
  ["general","honduras","bolivia","colombia"].forEach(k=>{
    const el = document.getElementById("note-"+k);
    if(el && state.notes[k]) el.value = state.notes[k];
  });
}

// ---- CHECKBOXES ----
function saveCheckVal(id, val){
  state.checks[id] = val;
  queueSave();
}

function toggleCheck(id){
  state.checks[id] = !state.checks[id];
  const row = document.getElementById("row-"+id);
  const cb = document.getElementById("cb-"+id);
  if(row) row.classList.toggle("done", !!state.checks[id]);
  if(cb) cb.checked = !!state.checks[id];
  updateAllProgress();
  queueSave();
}

function updateAllProgress(){
  state.cases.forEach(c=>{
    const bar = document.getElementById("prog-"+c.id);
    if(!bar) return;
    let total = PRE_ETAPAS.length, done = 0;
    PRE_ETAPAS.forEach(i=>{ if(state.checks[c.id+"_pre_"+i.k]) done++; });
    c.stakeholders.forEach(sh=>{
      INTERACTION_TYPES.forEach(itype=>{
        itype.items.forEach(i=>{ total++; if(state.checks[sh.id+"_"+itype.id+"_"+i.k]) done++; });
      });
      (sh.extraInts||[]).forEach(ei=>{
        EXTRA_INT_ITEMS.forEach(i=>{ total++; if(state.checks[sh.id+"_extra_"+ei.id+"_"+i.k]) done++; });
      });
    });
    bar.style.width = (total ? Math.round(done/total*100) : 0)+"%";
  });
}

function renderCheckRow(id, text){
  const checked = !!state.checks[id];
  return `<div class="check-row${checked?" done":""}" id="row-${id}">
    <input type="checkbox" id="cb-${id}" ${checked?"checked":""} onchange="toggleCheck('${id}')">
    <label for="cb-${id}">${text}</label>
  </div>`;
}

// ---- EXTRA INTERACTIONS ----
function saveExtraIntName(shId, eiId, val){
  state.cases.forEach(c=>{
    c.stakeholders.forEach(sh=>{
      if(sh.id===shId){
        const ei = (sh.extraInts||[]).find(x=>x.id===eiId);
        if(ei) ei.name = val;
      }
    });
  });
  queueSave();
}

function addExtraInt(caseId, shId){
  const c = state.cases.find(x=>x.id===caseId);
  const sh = c.stakeholders.find(x=>x.id===shId);
  if(!sh.extraInts) sh.extraInts = [];
  const num = 4 + sh.extraInts.length;
  sh.extraInts.push({id:"ei_"+Date.now(), name:"", num});
  renderAll();
  queueSave();
}

function deleteExtraInt(caseId, shId, eiId){
  const c = state.cases.find(x=>x.id===caseId);
  const sh = c.stakeholders.find(x=>x.id===shId);
  sh.extraInts = (sh.extraInts||[]).filter(x=>x.id!==eiId);
  renderAll();
  queueSave();
}

// ---- STAKEHOLDERS ----
function renderStakeholder(caseId, sh){
  let intHtml = "";
  INTERACTION_TYPES.forEach(itype=>{
    const dateKey = sh.id+"_date_"+itype.id;
    const dateVal = (state.checks[dateKey]||"").replace(/"/g,"&quot;");
    intHtml += `<div class="int-type" style="display:flex;align-items:center;gap:8px">
      <span style="flex:1">${itype.name}</span>
      <input type="text" value="${dateVal}" placeholder="dd/mm/aa" style="font-size:11px;border:none;border-bottom:1px solid #ddd;background:transparent;outline:none;color:#555;font-family:Arial,sans-serif;width:80px" oninput="saveCheckVal('${dateKey}',this.value)">
    </div>`;
    itype.items.forEach(i=>{ intHtml += renderCheckRow(sh.id+"_"+itype.id+"_"+i.k, i.t); });
  });
  (sh.extraInts||[]).forEach((ei, idx)=>{
    const num = 4 + idx;
    const eiDateKey = sh.id+"_extra_date_"+ei.id;
    const eiDateVal = (state.checks[eiDateKey]||"").replace(/"/g,"&quot;");
    intHtml += `<div class="int-type" style="display:flex;align-items:center;gap:6px">
      <span>${num}.</span>
      <input class="int-objetivo" type="text" value="${(ei.name||"").replace(/"/g,"&quot;")}" placeholder="Escribir objetivo de la interacción" oninput="saveExtraIntName('${sh.id}','${ei.id}',this.value)">
      <input type="text" value="${eiDateVal}" placeholder="dd/mm/aa" style="font-size:11px;border:none;border-bottom:1px solid #ddd;background:transparent;outline:none;color:#555;font-family:Arial,sans-serif;width:80px" oninput="saveCheckVal('${eiDateKey}',this.value)">
      <button class="sh-delete" onclick="deleteExtraInt('${caseId}','${sh.id}','${ei.id}')" title="Eliminar interacción">✕</button>
    </div>`;
    EXTRA_INT_ITEMS.forEach(i=>{ intHtml += renderCheckRow(sh.id+"_extra_"+ei.id+"_"+i.k, i.t); });
  });
  intHtml += `<button class="add-int-btn" onclick="addExtraInt('${caseId}','${sh.id}')">+ Agregar interacción</button>`;

  const badge = sh.combined ? `<span class="sh-badge">combinada</span>` : "";
  return `<div class="sh-block" id="shblock-${sh.id}">
    <div class="sh-head" onclick="toggleSh('${sh.id}')">
      <span class="sh-name">${sh.name}</span>${badge}
      <span class="sh-tog" id="sht-${sh.id}">▾</span>
      <button class="sh-delete" onclick="deleteSh(event,'${caseId}','${sh.id}')" title="Eliminar actor">✕</button>
    </div>
    <div class="sh-body collapsed" id="shbody-${sh.id}">${intHtml}</div>
  </div>`;
}

function toggleSh(id){
  const body = document.getElementById("shbody-"+id);
  const tog = document.getElementById("sht-"+id);
  const c = body.classList.toggle("collapsed");
  tog.style.transform = c ? "" : "rotate(180deg)";
}

function deleteSh(event, caseId, shId){
  event.stopPropagation();
  if(!confirm("¿Eliminar este actor y todos sus datos?")) return;
  const c = state.cases.find(x=>x.id===caseId);
  c.stakeholders = c.stakeholders.filter(x=>x.id!==shId);
  renderAll();
  queueSave();
}

// ---- META & LINKS ----
function saveMeta(caseId, field, val){
  if(!state.responsables[caseId]) state.responsables[caseId] = {};
  state.responsables[caseId][field] = val;
  queueSave();
}

function saveLink(caseId, linkKey, val){
  state.links[caseId+"_"+linkKey] = val;
  const btn = document.getElementById("open-"+caseId+"-"+linkKey);
  if(btn){ if(val){ btn.href=val; btn.style.display="inline"; } else { btn.style.display="none"; } }
  queueSave();
}

function renderLinkRow(caseId, linkKey, label){
  const val = state.links[caseId+"_"+linkKey] || "";
  return `<div class="link-row">
    <span class="link-label">${label}:</span>
    <input class="link-input" type="text" value="${val.replace(/"/g,"&quot;")}" placeholder="https://..." oninput="saveLink('${caseId}','${linkKey}',this.value)">
    <a id="open-${caseId}-${linkKey}" class="link-open" href="${val}" target="_blank" style="display:${val?'inline':'none'}">↗</a>
  </div>`;
}

// ---- ADD STAKEHOLDER FORM ----
function renderAddShForm(caseId){
  if(addingShFor !== caseId)
    return `<button class="add-sh-btn" onclick="startAddSh('${caseId}')">+ Agregar actor</button>`;
  const c = state.cases.find(x=>x.id===caseId);
  const names = c.stakeholders.map(s=>s.name);
  return `<div class="add-sh-form">
    <div style="font-size:12px;font-weight:600;color:#333;margin-bottom:8px">Nuevo actor</div>
    <div class="form-row">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-bottom:8px">
        <input type="checkbox" id="sh-comb-${caseId}"> ¿Interacción combinada?
      </label>
    </div>
    <div class="form-row">
      <label>Seleccionar actor(es) existentes</label>
      <div class="combined-checks">
        ${names.length ? names.map(n=>`<label><input type="checkbox" class="cpart-${caseId}" value="${n}"> ${n}</label>`).join("") : '<span style="font-size:11px;color:#bbb">Aún no hay actores registrados</span>'}
      </div>
    </div>
    <div class="form-row">
      <label>O escribir nombre nuevo</label>
      <input type="text" id="sh-extra-${caseId}" placeholder="Nombre del actor"/>
    </div>
    <div class="form-btns">
      <button onclick="confirmAddSh('${caseId}')">Agregar</button>
      <button onclick="cancelAddSh()" style="background:#fff;color:#333">Cancelar</button>
    </div>
  </div>`;
}

function editEmail(event, caseId){
  event.preventDefault();
  if(!state.responsables[caseId]) state.responsables[caseId] = {};
  const current = state.responsables[caseId].email || "";
  const val = prompt("Editar email:", current);
  if(val !== null){
    state.responsables[caseId].email = val.trim();
    queueSave();
    renderAll();
  }
}

function startAddSh(caseId){ addingShFor=caseId; renderAll(); }
function cancelAddSh(){ addingShFor=null; renderAll(); }

function confirmAddSh(caseId){
  const combined = document.getElementById("sh-comb-"+caseId)?.checked || false;
  let parts = [];
  document.querySelectorAll(".cpart-"+caseId+":checked").forEach(el=>parts.push(el.value));
  const extra = document.getElementById("sh-extra-"+caseId);
  const extraVal = extra ? extra.value.trim() : "";
  if(extraVal) parts.push(extraVal);
  if(!parts.length) return;
  const c = state.cases.find(x=>x.id===caseId);
  const finalName = parts.join(" + ");
  c.stakeholders.push({id:"sh_"+Date.now(), name:finalName, combined, parts, extraInts:[]});
  addingShFor = null;
  renderAll();
  queueSave();
}

// ---- RENDER ----
function renderCase(c){
  const meta = state.responsables[c.id] || {};
  const preRows = PRE_ETAPAS.map(i=>renderCheckRow(c.id+"_pre_"+i.k, i.t)).join("");
  const shBlocks = c.stakeholders.map(sh=>renderStakeholder(c.id, sh)).join("");
  return `<div class="col-card">
    <div class="col-head">
      <h3>${c.title}</h3>
      <div class="col-meta">
        <div class="meta-row">
          <span class="meta-label">Socio implementador:</span>
          <input class="meta-val" type="text" value="${(meta.partner||c.partner||"").replace(/"/g,"&quot;")}" placeholder="${c.partner}" oninput="saveMeta('${c.id}','partner',this.value)">
        </div>
        <div class="meta-row">
          <span class="meta-label">Responsable:</span>
          <input class="meta-val" type="text" value="${(meta.responsable||"").replace(/"/g,"&quot;")}" placeholder="Nombre" oninput="saveMeta('${c.id}','responsable',this.value)">
        </div>
        <div class="meta-row">
          <span class="meta-label">Email:</span>
          ${meta.email
            ? `<a href="mailto:${meta.email}" style="font-size:12px;color:#378ADD;text-decoration:none;flex:1" title="Cambiar: haz clic para editar" onclick="editEmail(event,'${c.id}')">${meta.email}</a>`
            : `<input class="meta-val" type="email" id="email-input-${c.id}" value="" placeholder="correo@ejemplo.org" oninput="saveMeta('${c.id}','email',this.value)" onblur="renderAll()">`
          }
        </div>
        <div style="margin-top:8px">
          ${renderLinkRow(c.id,"drive","Drive")}
          ${renderLinkRow(c.id,"sharepoint","SharePoint")}
        </div>
      </div>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="prog-${c.id}" style="width:0%"></div></div>
    <div class="checklist">
      <div class="sec-label">Pasos generales</div>
      ${preRows}
      <div class="sec-label" style="margin-top:12px">Interacciones de Etapa 2</div>
      ${shBlocks}
      ${renderAddShForm(c.id)}
    </div>
  </div>`;
}

function renderAll(){
  document.getElementById("cases-grid").innerHTML = state.cases.map(renderCase).join("");
  updateAllProgress();
}

async function init(){
  await loadState();
  renderAll();
  loadNotes();
}

init();
</script>
</body>
</html>
